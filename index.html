<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<meta name="theme-color" content="#08080c" />
<title>Ghost Chat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ SVG SPRITE ============ -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-ghost" viewBox="0 0 24 24">
    <path d="M12 2C7.6 2 4 5.6 4 10v10.2c0 .6.7.9 1.1.5l2.2-2.2 2.2 2.2c.3.3.7.3 1 0l2-2 2 2c.3.3.7.3 1 0l2.2-2.2 2.2 2.2c.4.4 1.1.1 1.1-.5V10c0-4.4-3.6-8-8-8z" fill="currentColor"/>
    <circle cx="9.5" cy="10" r="1" fill="#08080c"/>
    <circle cx="14.5" cy="10" r="1" fill="#08080c"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.5" fill="none"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <polyline points="23 4 23 10 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="1 20 1 14 7 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>
  <symbol id="i-back" viewBox="0 0 24 24">
    <polyline points="15 18 9 12 15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>
  <symbol id="i-phone" viewBox="0 0 24 24">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>
  </symbol>
  <symbol id="i-phone-off" viewBox="0 0 24 24">
    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67M8.09 9.91a16 16 0 0 0 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="23" y1="1" x2="1" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-video" viewBox="0 0 24 24">
    <path d="M23 7l-7 5 7 5V7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
  </symbol>
  <symbol id="i-video-off" viewBox="0 0 24 24">
    <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-more" viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
  </symbol>
  <symbol id="i-clip" viewBox="0 0 24 24">
    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>
  <symbol id="i-smile" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="9" cy="9" r="1" fill="currentColor"/>
    <circle cx="15" cy="9" r="1" fill="currentColor"/>
  </symbol>
  <symbol id="i-mic" viewBox="0 0 24 24">
    <rect x="9" y="2" width="6" height="13" rx="3" stroke="currentColor" stroke-width="2" fill="none"/>
    <path d="M19 11v1a7 7 0 0 1-14 0v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-mic-off" viewBox="0 0 24 24">
    <line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-stop" viewBox="0 0 24 24">
    <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24">
    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>
</svg>

<!-- LOADING -->
<div id="screen-loading" class="screen active">
  <div class="logo-orb">
    <svg class="ghost"><use href="#i-ghost"/></svg>
  </div>
  <h1>Ghost Chat</h1>
  <div class="spinner"></div>
  <p id="loading-msg" class="dim">Conectando…</p>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen">
  <div class="login-card">
    <div class="logo-orb small">
      <svg class="ghost"><use href="#i-ghost"/></svg>
    </div>
    <h1>Bem-vindo ao Ghost</h1>
    <p class="dim">Escolha seu nome. Sem e-mail, sem telefone, sem rastros.</p>

    <label class="field">
      <span>Nome de usuário</span>
      <input id="login-username" type="text" maxlength="20" placeholder="ex: fantasma_azul" autocomplete="off" />
    </label>

    <label class="field">
      <span>Seu ID público</span>
      <div class="id-row">
        <code id="login-ghostid">GHOST-XXXX-XXXX</code>
        <button id="btn-regen" title="Regenerar" type="button">
          <svg><use href="#i-refresh"/></svg>
        </button>
      </div>
    </label>

    <button id="btn-login" class="primary">Entrar no Ghost Chat</button>
    <p id="login-error" class="error"></p>
    <p class="fineprint">Sua chave de criptografia é gerada no seu dispositivo.</p>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen app">
  <aside id="sidebar">
    <header class="side-head">
      <img id="me-avatar" class="avatar" />
      <div class="me-info">
        <strong id="me-nick">…</strong>
        <small id="me-id" class="dim">…</small>
      </div>
      <button id="btn-new" class="icon" title="Novo" type="button"><svg><use href="#i-plus"/></svg></button>
      <button id="btn-settings" class="icon" title="Configurações" type="button"><svg><use href="#i-gear"/></svg></button>
    </header>

    <nav class="tabs">
      <button data-tab="chats" class="tab active" type="button">Conversas</button>
      <button data-tab="contacts" class="tab" type="button">Contatos</button>
      <button data-tab="communities" class="tab" type="button">Comunid.</button>
    </nav>

    <div id="list" class="list"></div>
  </aside>

  <main id="pane">
    <div id="empty" class="empty">
      <div class="logo-orb big">
        <svg class="ghost"><use href="#i-ghost"/></svg>
      </div>
      <p>Selecione uma conversa ou crie uma nova</p>
    </div>

    <section id="conv" hidden>
      <header class="conv-head">
        <button id="btn-back" class="icon only-mobile" type="button"><svg><use href="#i-back"/></svg></button>
        <img id="conv-avatar" class="avatar" />
        <div class="conv-info">
          <strong id="conv-name">…</strong>
          <small id="conv-sub" class="dim"></small>
        </div>
        <button id="btn-call-audio" class="icon" title="Ligar (áudio)" type="button"><svg><use href="#i-phone"/></svg></button>
        <button id="btn-call-video" class="icon" title="Ligar (vídeo)" type="button"><svg><use href="#i-video"/></svg></button>
        <button id="btn-conv-menu" class="icon" type="button"><svg><use href="#i-more"/></svg></button>
      </header>

      <div id="messages" class="messages"></div>

      <footer class="composer">
        <button id="btn-attach" class="icon" title="Anexar" type="button"><svg><use href="#i-clip"/></svg></button>
        <input type="file" id="attach-input" hidden />
        <button id="btn-emoji" class="icon" type="button"><svg><use href="#i-smile"/></svg></button>
        <input id="msg-input" type="text" placeholder="Mensagem criptografada…" maxlength="4000" />
        <button id="btn-mic" class="icon" title="Gravar áudio" type="button">
          <svg class="ic-mic"><use href="#i-mic"/></svg>
          <svg class="ic-stop"><use href="#i-stop"/></svg>
        </button>
        <button id="btn-send" class="icon send" type="button"><svg><use href="#i-send"/></svg></button>
      </footer>
    </section>
  </main>
</div>

<!-- CHAMADA -->
<div id="call-overlay" hidden>
  <div class="call-box">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
    <div class="call-info">
      <strong id="call-peer">…</strong>
      <small id="call-status" class="dim">…</small>
    </div>
    <div class="call-controls">
      <button id="call-mic" class="round" type="button">
        <svg class="on"><use href="#i-mic"/></svg>
        <svg class="off"><use href="#i-mic-off"/></svg>
      </button>
      <button id="call-cam" class="round" type="button">
        <svg class="on"><use href="#i-video"/></svg>
        <svg class="off"><use href="#i-video-off"/></svg>
      </button>
      <button id="call-end" class="round end" type="button"><svg><use href="#i-phone-off"/></svg></button>
    </div>
  </div>
</div>

<!-- TOAST de chamada recebida -->
<div id="incoming-toast" hidden>
  <div class="incoming-box">
    <div class="logo-orb small pulse">
      <svg class="ghost"><use href="#i-ghost"/></svg>
    </div>
    <strong id="incoming-from">…</strong>
    <small id="incoming-type" class="dim">Ligação…</small>
    <div class="row-incoming">
      <button id="incoming-reject" class="round end" type="button"><svg><use href="#i-phone-off"/></svg></button>
      <button id="incoming-accept" class="round ok" type="button"><svg><use href="#i-phone"/></svg></button>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="emoji-picker" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
